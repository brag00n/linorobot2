# Convention, pas correctif : c'etait le SEUL paquet des onze sans ce fichier. Il fixe le
# domicile du console_script a install/<pkg>/lib/<pkg>/, la ou `ros2 launch` cherche son
# libexec -- sinon setuptools l'installerait dans .../bin/.
# ATTRIBUTION HONNETE : l'echec "libexec directory .../lib/<pkg> does not exist" observe le
# 2026-09-26 n'a PAS ete leve par ce fichier. colcon passe lui-meme --script-dir sous
# --symlink-install, et c'est la reconstruction declenchee par `restart: unless-stopped` qui
# a produit le repertoire. Garde parce qu'un jour on construira sans --symlink-install.
[develop]
script_dir=$base/lib/bamboo_controler_YBStm32v3
[install]
install_scripts=$base/lib/bamboo_controler_YBStm32v3
