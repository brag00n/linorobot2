# ============================================================================
# bamboo4WD_V4_WSEsp32 (BambooWS) - SOURCE UNIQUE DE VERITE PHYSIQUE
# ============================================================================
# Ce fichier porte la geometrie et la motorisation du robot, et RIEN D'AUTRE.
# Tous les consommateurs s'y referent : le driver ROS (bamboo_base), les
# arguments xacro de l'URDF (linorobot2_description) et les outils hote
# (linorobot2_hardware/tools/robot_control/robot_profile.py).
#
# N'Y ENTRENT PAS les faits d'hote, legitimement differents d'une machine a
# l'autre : port serie, baud, VID:PID. Ils restent dans config/esp32_driver.yaml
# et dans les profils robots/*.json du depot firmware.
#
# Format ROS natif (`/**: ros__parameters:`) pour etre utilisable tel quel :
#   ros2 param load /esp32_mavlink_driver <ce fichier>
#
# ---------------------------------------------------------------------------
# PROVENANCE DES VALEURS GEOMETRIQUES : constructeur WaveShare, produit
# IDENTIFIE PAR LA MESURE (2026-09-23).
#   depot   waveshareteam/ugv_base_general (firmware d'origine de la MEME carte
#           General Driver for Robots), fichier General_Driver/ugv_config.h
#   produit "RaspRover" (chassis 4WD a base de Raspberry Pi = ce robot), soit
#           WHEEL_D 0.0800 / ONE_CIRCLE_PLUSES 2100 / TRACK_WIDTH 0.125
#
# Ce fichier annoncait auparavant le produit "UGV Rover" (1650 / 0.172). C'est
# la MESURE qui a tranche entre les deux variantes : tachymetre optique (camera
# du banc, marque de papier sur la roue, angle integre sur la fenetre) compare
# aux compteurs d'encodeur remontes dans Esp32Status, roues surelevees, deux
# vitesses -- 640.7 counts/s pour 17.6 RPM optiques, puis 1317.2 pour 38.2, soit
# 2028 a 2221 tics/tour. 1650 est exclu (l'odometrie surestimerait de 27 %),
# 2100 tombe dans l'intervalle et reproduit les deux essais a +3 % / -2 %.
# Detail de la methode : linorobot2_hardware/tools/robot_control/mcp/analysis.py
# (outil `tacho_stats`) et tools/robot_controlv3/nodes/WheelTachoNode.py.
#
# Le comptage identifie le PRODUIT, donc la voie change avec lui : 0.172
# appartient a la variante dont le comptage est refute. Le diametre, lui, est le
# meme (0.0800) dans les deux variantes, donc il ne bouge pas.
#
# CE QU'IL RESTE A FAIRE : la voie 0.125 est une valeur CONSTRUCTEUR deduite de
# l'identification, pas une mesure de CE robot -- a confirmer au metre ruban
# (entraxe G/D) ou par le 360 deg du lot 4.4, ce qui vaut aussi pour le
# diametre (2 m au metre ruban). Les lignes marquees << NON MESURE >> n'ont,
# elles, aucune source du tout.
# NE PAS reprendre les gains PID de WaveShare (kp 20 / ki 2000 / kd 0) : leur
# regulateur travaille en m/s avec anti-windup a 255, formulation differente de
# la notre (RPM) - ils ne sont pas comparables.
# ---------------------------------------------------------------------------
/**:
  ros__parameters:

    # --- identite cinematique -------------------------------------------
    # 4 roues fixes, entrainement differentiel par cote (skid steer).
    robot_base: "4wd"
    # Type de chassis attendu par la carte (FOURWHEEL). Enumere cote firmware :
    # 1 MECANUM, 2 MECANUM_MAX, 3 MECANUM_MINI, 4 FOURWHEEL, 5 ACKERMAN, 6 SUNRISE.
    car_type: 4.0

    # --- geometrie -------------------------------------------------------
    # Tics par tour de roue, en sortie de reducteur, sur une voie encodeur.
    # MESURE (voir l'en-tete) : ONE_CIRCLE_PLUSES du RaspRover, confirme au
    # tachymetre optique contre les compteurs d'encodeur a deux vitesses.
    # Les 10 tours a la main du lot 4.1 sont donc devenus inutiles.
    counts_per_rev: 2100.0
    # Diametre de roue au sol, en metres. Valeur constructeur WHEEL_D, confirmee
    # par le maillage de roue de leur URDF (diametre 0.0800, largeur 0.0425).
    wheel_diameter_m: 0.08
    # << A CONFIRMER >> entraxe gauche/droite (voie), en metres. Valeur
    # constructeur TRACK_WIDTH du RaspRover, retenue parce que la mesure du
    # comptage a identifie CETTE variante. La voie ne se deduit PAS d'une mesure
    # de RPM : seul le metre ruban, ou l'erreur d'angle sur un 360 deg au sol
    # (lot 4.4), peut la valider. Elle pilote la conversion angular.z -> RPM,
    # donc une erreur ici fait tourner le robot trop ou pas assez, sans toucher
    # a la vitesse en ligne droite.
    wheel_separation_m: 0.125

    # --- motorisation ----------------------------------------------------
    # << NON MESURE >> plafond moteur utilise par la cinematique embarquee :
    # max_rpm = min(motor_power_max_voltage, motor_operating_voltage)
    #           / motor_operating_voltage * motor_max_rpm * MAX_RPM_RATIO(0.85).
    # ATTENTION au bornage : kinematics.cpp fait
    #   supply = constrain(motor_power_max_voltage, 0, motor_operating_voltage)
    # donc le rapport de tensions ne depasse JAMAIS 1 et une tension
    # d'alimentation superieure n'augmente rien. Avec 12 et 6 le plafond vaut
    # 250 * 0.85 = 212.5 RPM, pas 425. Pour depasser 212.5 il faut relever
    # motor_max_rpm (caracteristique du moteur), pas les tensions.
    # Les deux valeurs sont celles du firmware (MOTOR_OPERATING_VOLTAGE 6,
    # MOTOR_POWER_MAX_VOLTAGE 12) : les intervertir divise le plafond par 2.
    motor_max_rpm: 250.0
    motor_operating_voltage: 6.0
    motor_power_max_voltage: 12.0

    # --- PID de vitesse roue --------------------------------------------
    # ATTENTION : sur cette carte les 4 moteurs PARTAGENT un seul triplet
    # (repliement d'index idx % 3 cote ESP32), contrairement au STM32.
    # K_I eleve pour une integrale non bornee a 10 Hz -> premier suspect en cas
    # de depassement lors du reglage (lot 4).
    pid_kp: 0.6
    pid_ki: 0.3
    pid_kd: 0.5

    # --- mapping des voies encodeur -------------------------------------
    # encSpeed() renvoie [M1..M4] mais il n'y a que 2 voies PHYSIQUES :
    # M3 recopie M1 et M4 recopie M2 (un seul encodeur par cote).
    # << A VERIFIER >> que le groupe A du TB6612FNG entraine bien le cote gauche
    # (observation roues surelevees, lot 4). Indice : WaveShare tourne ce kit
    # avec SET_MOTOR_DIR = false, contre true pour l'UGV Beast.
    encoder_left_index: 0
    encoder_right_index: 1
    invert_left: false
    invert_right: false
