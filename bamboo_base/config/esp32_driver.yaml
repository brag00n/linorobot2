# Driver ESP32 MAVLink : FAITS D'HOTE ET DE TRANSPORT UNIQUEMENT.
#
# La geometrie et la motorisation NE SONT PLUS ICI : elles vivent dans la source
# unique config/robots/bamboo4WD_V4_WSEsp32.yaml, chargee par driver.launch.py
# APRES ce fichier. Redeclarer un parametre geometrique ici le ferait perdre
# silencieusement face au fichier canonique -> ne pas le faire.
/**:
  ros__parameters:
    # --- lien serie (propre a la machine : /dev/esp32 sur le RPi, COMx sous Windows) ---
    port: /dev/esp32
    baud: 921600
    publish_rate_hz: 30.0

    # --- frames ---
    odom_frame: odom
    base_frame: base_footprint
    imu_frame: imu_link
    # L'EKF (robot_localization) possede le TF odom->base_footprint -> driver ne le publie PAS.
    publish_odom_tf: false

    # --- VERROU D'ACTUATION ---
    # false = LECTURE SEULE (L5) : aucune commande moteur emise, robot immobile/pousse a la main.
    # true  = ACTUATION (L6) : requiert roues surelevees + geometrie calibree.
    enable_cmd_vel: false
    cmd_vel_timeout_s: 0.5
