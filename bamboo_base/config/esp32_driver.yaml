/**:
  ros__parameters:
    # --- lien serie ---
    port: /dev/esp32
    baud: 921600
    publish_rate_hz: 30.0

    # --- geometrie (PLACEHOLDERS a calibrer au L6, roues surelevees puis mesure au sol) ---
    # Les valeurs firmware sont absurdes (COUNTS_PER_REV=2114, WHEEL_DIAMETER=0.8,
    # LR_WHEELS_DISTANCE=1.3) ; l'odom reste fausse d'echelle tant que non calibree ici.
    counts_per_rev: 2114.0
    wheel_diameter_m: 0.08
    wheel_separation_m: 0.30

    # --- mapping encodeurs (2 voies reelles : M1=gauche, M2=droite ; M3=M1, M4=M2) ---
    encoder_left_index: 0
    encoder_right_index: 1
    invert_left: false
    invert_right: false

    # --- frames ---
    odom_frame: odom
    base_frame: base_footprint
    imu_frame: imu_link
    # L'EKF (robot_localization) possede le TF odom->base_footprint -> driver ne le publie PAS.
    publish_odom_tf: false

    # --- VERROU D'ACTUATION ---
    # false = LECTURE SEULE (L5) : aucune commande moteur emise, robot immobile/pousse a la main.
    # true  = ACTUATION (L6) : requiert roues surelevees + geometrie calibree.
    enable_cmd_vel: false
    cmd_vel_timeout_s: 0.5
