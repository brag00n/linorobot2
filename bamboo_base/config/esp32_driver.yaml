# Driver ESP32 MAVLink : FAITS D'HOTE ET DE TRANSPORT UNIQUEMENT.
#
# La geometrie et la motorisation NE SONT PLUS ICI : elles vivent dans la source
# unique config/robots/bamboo4WD_V4_WSEsp32.yaml, chargee par driver.launch.py
# APRES ce fichier. Redeclarer un parametre geometrique ici le ferait perdre
# silencieusement face au fichier canonique -> ne pas le faire.
/**:
  ros__parameters:
    # --- lien serie (propre a la machine : /dev/esp32 sur le RPi, COMx sous Windows) ---
    port: /dev/esp32
    baud: 921600
    publish_rate_hz: 30.0

    # --- frames ---
    odom_frame: odom
    base_frame: base_footprint
    imu_frame: imu_link
    # L'EKF (robot_localization) possede le TF odom->base_footprint -> driver ne le publie PAS.
    publish_odom_tf: false

    # --- VERROU D'ACTUATION ---
    # false = LECTURE SEULE (L5) : aucune commande moteur emise, robot immobile/pousse a la main.
    # true  = ACTUATION (L6) : requiert roues surelevees + geometrie calibree.
    enable_cmd_vel: false
    cmd_vel_timeout_s: 0.5

    # --- fiabilite QoS des capteurs (fait d'hote : depend des consommateurs) ---
    # `sensor_data` est BEST-EFFORT, donc INVISIBLE a travers rosbridge, qui souscrit en
    # RELIABLE : c'est pour ca que imu/data n'etait pas diagnosticable depuis le MCP.
    # `reliable` la rend lisible. Lu UNE FOIS au demarrage : un publisher ne change pas de
    # fiabilite en marche (il faudrait le recreer, coupant les souscripteurs en place).
    imu_qos: reliable

    # --- journal de la carte ---
    # Seuil ecrit DANS la carte (PARAM LOG_LEVEL, idx 19) : le firmware ne transmet pas ce
    # qu'il filtre, ce reglage menage donc l'UART partage avec la telemetrie.
    # MAV_SEVERITY : 0 EMERGENCY .. 3 ERROR, 4 WARNING, 6 INFO, 7 DEBUG.
    board_log_level: 6
    # Attente d'une RELECTURE de config (bloquante -> suspend brievement la publication).
    # La carte repond d'ordinaire en ~50 ms ; 1 s laisse de la marge sans figer le noeud.
    board_readback_timeout_s: 1.0
