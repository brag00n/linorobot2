# ============================================================================
# bamboo_mode_manager -- fichier MODELE des modes du robot
# ============================================================================
# Conventions de micro-ROS/system_modes, sans le paquet (cf. en-tete de
# mode_manager_node.py, qui porte l'etude et le choix). Chaque champ est une
# CHAINE dont les items sont separes par ';' : une liste ROS vide ne se type
# pas, une chaine vide si.
#
#   label          texte court du HUD et de l'OLED (21 colonnes : rester court)
#   requires       `node:/nom` (noeud vivant) ou `param:nom` (booleen du
#                  gestionnaire, pousse par le launch : has_gimbal)
#   enter_modecmd  ModeCmd `cible=valeur` publies a l'entree (groupe suivi)
#   exit_modecmd   idem a la sortie
#   enter_params   `/noeud:param=valeur` poses a l'entree
#   exit_params    idem a la sortie
#   exit_cancel    actions dont les buts en cours sont ANNULES a la sortie
#
# DETECTION DE VISAGES : `detect_enabled` de tracking_node n'est VRAI qu'en TRACKING. Elle
# coutait 2,6 coeurs sur 4 en permanence (mesure 2026-10-04), y compris suivi coupe. Un
# noeud ABSENT (groupe suivi arrete) n'est pas une faute : il n'y a rien a regler.
#
# L'ORDRE de `modes` est celui de la croix gauche/droite. Un mode indisponible
# (prerequis manquant) est SAUTE par la croix et refuse par change_mode, avec
# sa raison (outil MCP ou `ros2 service call /bamboo/get_available_modes`).
#
# Les TOUCHES de chaque mode ne sont PAS ici : elles sont un fait de MANETTE et
# vivent dans joy_bamboo.yaml (keymap.<mode>.*). Ce fichier dit ce que le mode
# fait au ROBOT.
# ============================================================================

bamboo_mode_manager:
  ros__parameters:
    modes: ["conduite", "tracking", "calibration", "navigation", "sante"]
    default_mode: "conduite"
    mode_cmd_topic: "/videotracking/mode_cmd"
    ack_timeout_s: 1.0
    start_delay_s: 3.0

    # Conduite seule : le mode de repli, toujours disponible. Il ne touche a
    # rien en entrant -- le suivi garde l'etat qu'on lui a donne.
    conduite:
      label: "CONDUITE"
      enter_params: "/tracking_node:detect_enabled=false"

    # Commandes du groupe videotracking (suivi, reconnaissance, apprentissage).
    # Rien a l'entree : c'est la carte de touches qui change.
    tracking:
      label: "TRACKING"
      enter_params: "/tracking_node:detect_enabled=true"

    # Calibration du glissement en rotation. Disponible seulement si le noeud
    # tourne (option `calibration_enabled` du fichier canonique). Quitter le
    # mode ANNULE une calibration en cours : le robot ne doit pas continuer a
    # tourner dans un mode ou ses touches n'existent plus.
    calibration:
      label: "CALIB"
      requires: "node:/bamboo_calibration"
      enter_params: "/tracking_node:detect_enabled=false"
      exit_cancel: "/bamboo_calibration/calibrate"

    # Navigation autonome : declaree pour sa place dans la croix, indisponible
    # tant que le lot NAV n'a pas de bt_navigator (Nav2).
    # Navigation autonome (bamboo_navigation, conteneur `navigation`, a la demande). Exige
    # le superviseur ET un lidar declare par le robot (sensors.lidar -> has_lidar, pousse par
    # control.launch.py). Deux sous-modes, choisis par la croix haut/bas : exploration
    # (carte) et navigation (points). Quitter le mode ANNULE le but en cours.
    navigation:
      label: "NAV"
      requires: "node:/nav_supervisor;param:has_lidar"
      enter_params: "/tracking_node:detect_enabled=false"
      exit_cancel: "/navigate_to_pose"

    # Sante du robot : la carte du HUD (haut droite) liste tout ce qui n'est pas VERT dans
    # l'arbre de diagnostic agrege (modules et composants, avec leur message). Lecture
    # seule : rien a l'entree ni a la sortie.
    sante:
      label: "SANTE"
      enter_params: "/tracking_node:detect_enabled=false"
