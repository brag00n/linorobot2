# ============================================================================
# diagnostic_aggregator - partie PROPRE a BambooWS (bamboo4WD_V4_WSEsp32)
# ============================================================================
# Empilee apres aggregator.yaml par diagnostics.launch.py quand robot:=bamboo4WD_V4_WSEsp32.
# PAS de servocam_node : ce robot n'a aucune nacelle (suivi en CAMERA FIXE).
analyzers:
  ros__parameters:
    # Lidar D500 (bamboo_lidar, conteneur driver.lidarD500, a la demande). Sans `expected` :
    # le lidar n'est pas toujours lance, et un module ATTENDU absent passerait PERIME en
    # permanence. Le diagnostic de NAVIGATION, lui, exige le scan quand il en a besoin.
    lidar:
      type: diagnostic_aggregator/AnalyzerGroup
      path: lidar (D500)
      analyzers:
        scan:
          type: diagnostic_aggregator/GenericAnalyzer
          path: scan_monitor
          startswith: [ 'scan_monitor:' ]
          timeout: 5.0
    # Navigation (bamboo_navigation, conteneur navigation, a la demande ; sans `expected`,
    # meme raison que le lidar). Le JUGE est nav_supervisor : il exige les capteurs declares
    # par le robot, la fraicheur de /odom et les TF du sous-mode courant.
    navigation:
      type: diagnostic_aggregator/AnalyzerGroup
      path: navigation
      analyzers:
        superviseur:
          type: diagnostic_aggregator/GenericAnalyzer
          path: nav_supervisor
          startswith: [ 'nav_supervisor:' ]
          timeout: 5.0
    # ECARTES (sinon ils tombent dans "Other", en ERROR, et peignent tout l'arbre en rouge) :
    #   - lifecycle_manager_* "Nav2 Health" : ERROR "Nav2 is inactive" des que Nav2 n'est
    #     pas actif -- c'est l'etat NORMAL du sous-mode idle ;
    #   - ekf_filter_node "odometry filtered topic status" : ERROR "No events recorded" alors
    #     que /odom sort a 20 Hz (compteur de robot_localization jamais alimente ; constate
    #     le 2026-10-11). La fraicheur de /odom est deja exigee par nav_supervisor.
    navigation_bruit:
      type: diagnostic_aggregator/DiscardAnalyzer
      path: navigation_bruit
      startswith: [ 'lifecycle_manager_navigation:', 'lifecycle_manager_localization:',
                    'ekf_filter_node:' ]
    # --- Carte ESP32 : la base roulante et ses capteurs -------------------------------
    # MEMES taches que driver.stm32 (module commun bamboo_base.driver_diagnostics).
    driver_esp32:
      type: diagnostic_aggregator/AnalyzerGroup
      path: driver.esp32 (carte ESP32)
      analyzers:
        driver:
          type: diagnostic_aggregator/GenericAnalyzer
          path: esp32_mavlink_driver
          startswith: [ 'esp32_mavlink_driver:' ]
          expected: [ 'esp32_mavlink_driver: liaison serie',
                      'esp32_mavlink_driver: batterie',
                      'esp32_mavlink_driver: imu',
                      'esp32_mavlink_driver: configuration carte',
                      'esp32_mavlink_driver: actuation',
                      'esp32_mavlink_driver: compensation' ]
          timeout: 5.0
