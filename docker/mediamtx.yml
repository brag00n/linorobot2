# Configuration MediaMTX pour la diffusion H.264 distante de la webcam UVC.
# La webcam encode le H.264 en MATERIEL (30 fps a 640x480) ; ffmpeg le recopie tel quel
# (-c:v copy) vers MediaMTX -> AUCUN re-encodage sur le RPi (CPU ~ 0). MediaMTX ressert en
# RTSP (VLC, faible latence), HLS (navigateur, simple) et WebRTC (navigateur, faible latence).
#
# Source A LA DEMANDE : ffmpeg ne demarre que lorsqu'un client se connecte, et s'arrete apres
# runOnDemandCloseAfter. Ainsi /dev/video0 reste LIBRE quand personne ne regarde -> le pipeline
# MJPG->ROS (gscam2) peut utiliser la camera (contrainte UVC : un seul format actif a la fois).

logLevel: info

# Ports par defaut : RTSP 8554, HLS 8888, WebRTC 8889 (+ ICE UDP 8189).
rtspAddress: :8554
hlsAddress: :8888
webrtcAddress: :8889

# --- Metriques pour le diagnostic (lot DIAGNOSTICS, observateur bamboo_health) -----------
# METRIQUES et non API, et c'est le choix de securite : l'action `api` permet aussi de
# RECONFIGURER le serveur, `metrics` ne fait que LIRE (format Prometheus : etat des chemins,
# octets, lecteurs). Le port 9998 n'est PAS publie sur l'hote (cf. docker-compose.yaml) : seul
# le reseau compose l'atteint.
metrics: yes
metricsAddress: :9998

# DEFINIR authInternalUsers REMPLACE les defauts embarques, il ne les complete pas. Les deux
# premieres entrees sont donc la RECOPIE EXACTE des defauts de la v1.21.0 (mediamtx.yml amont,
# tag v1.21.0) -- sans elles, plus aucun client ne pourrait lire le flux. Seule la troisieme est
# ajoutee : l'action `metrics` depuis les reseaux Docker (172.16.0.0/12 couvre les pools par
# defaut, donc un sous-reseau compose recree ailleurs reste couvert).
authInternalUsers:
  - user: any
    pass:
    ips: []
    permissions:
      - action: publish
        path:
      - action: read
        path:
      - action: playback
        path:
  - user: any
    pass:
    ips: ["127.0.0.1", "::1"]
    permissions:
      - action: api
      - action: metrics
      - action: pprof
  - user: any
    pass:
    ips: ["172.16.0.0/12"]
    permissions:
      - action: metrics

paths:
  # Flux camera : rtsp://<rpi>:8554/cam | http://<rpi>:8888/cam (HLS) | http://<rpi>:8889/cam (WebRTC)
  cam:
    # ffmpeg lit le H.264 natif de la webcam et le RECOPIE (pas de re-encodage) vers MediaMTX.
    runOnDemand: >
      ffmpeg -f v4l2 -input_format h264 -video_size 640x480 -framerate 30
      -i /dev/video0 -c:v copy -f rtsp rtsp://localhost:8554/$MTX_PATH
    runOnDemandRestart: yes
    runOnDemandCloseAfter: 15s
