# Configuration MediaMTX pour la diffusion H.264 distante de la webcam UVC.
# La webcam encode le H.264 en MATERIEL (30 fps a 640x480) ; ffmpeg le recopie tel quel
# (-c:v copy) vers MediaMTX -> AUCUN re-encodage sur le RPi (CPU ~ 0). MediaMTX ressert en
# RTSP (VLC, faible latence), HLS (navigateur, simple) et WebRTC (navigateur, faible latence).
#
# Source A LA DEMANDE : ffmpeg ne demarre que lorsqu'un client se connecte, et s'arrete apres
# runOnDemandCloseAfter. Ainsi /dev/video0 reste LIBRE quand personne ne regarde -> le pipeline
# MJPG->ROS (gscam2) peut utiliser la camera (contrainte UVC : un seul format actif a la fois).

logLevel: info

# Ports par defaut : RTSP 8554, HLS 8888, WebRTC 8889 (+ ICE UDP 8189).
rtspAddress: :8554
hlsAddress: :8888
webrtcAddress: :8889
# WebRTC : MediaMTX annonce au navigateur les IP de SES interfaces. Le conteneur est sur le
# RESEAU DE L'HOTE (docker-compose.yaml, camera.h264) : ce sont donc celles du RPi, toujours
# justes. Sur le reseau compose il n'annoncait que 172.x, injoignable -> page ouverte mais video
# jamais recue (« deadline exceeded while waiting connection », 2026-10-16). On n'annonce que
# l'interface Wi-Fi : les ponts Docker (docker0, br-*) feraient essayer au navigateur des
# adresses mortes. (La liste d'EXCLUSION n'existe pas en v1.21.0 : refusee au demarrage.)
webrtcIPsFromInterfacesList: [wlan0]

# --- Metriques pour le diagnostic (lot DIAGNOSTICS, observateur bamboo_health) -----------
# METRIQUES et non API, et c'est le choix de securite : l'action `api` permet aussi de
# RECONFIGURER le serveur, `metrics` ne fait que LIRE (format Prometheus : etat des chemins,
# octets, lecteurs). Depuis le passage au RESEAU DE L'HOTE (2026-10-16), le port 9998 ecoute sur
# le reseau local ; ce sont les permissions ci-dessous qui le gardent : `metrics` n'est accorde
# qu'a la boucle locale et aux reseaux Docker, un poste du reseau local est refuse.
metrics: yes
metricsAddress: :9998

# DEFINIR authInternalUsers REMPLACE les defauts embarques, il ne les complete pas. Les deux
# premieres entrees sont donc la RECOPIE EXACTE des defauts de la v1.21.0 (mediamtx.yml amont,
# tag v1.21.0) -- sans elles, plus aucun client ne pourrait lire le flux. Seule la troisieme est
# ajoutee : l'action `metrics` depuis les reseaux Docker (172.16.0.0/12 couvre les pools par
# defaut, donc un sous-reseau compose recree ailleurs reste couvert).
authInternalUsers:
  - user: any
    pass:
    ips: []
    permissions:
      - action: publish
        path:
      - action: read
        path:
      - action: playback
        path:
  - user: any
    pass:
    ips: ["127.0.0.1", "::1"]
    permissions:
      - action: api
      - action: metrics
      - action: pprof
  - user: any
    pass:
    ips: ["172.16.0.0/12"]
    permissions:
      - action: metrics
  # (reseau de l'hote : le diagnostic arrive par la passerelle Docker, dans 172.16.0.0/12)

paths:
  # Flux camera : rtsp://<rpi>:8554/cam | http://<rpi>:8888/cam (HLS) | http://<rpi>:8889/cam (WebRTC)
  cam:
    # ffmpeg lit le H.264 natif de la webcam et le RECOPIE (pas de re-encodage) vers MediaMTX.
    runOnDemand: >
      ffmpeg -f v4l2 -input_format h264 -video_size 640x480 -framerate 30
      -i /dev/bamboocam -c:v copy -f rtsp rtsp://localhost:8554/$MTX_PATH
    runOnDemandRestart: yes
    runOnDemandCloseAfter: 15s

  # Flux HUD (image annotee de l'overlay) en H.264 : rtsp://<rpi>:8554/hud |
  # http://<rpi>:8889/hud (WebRTC, ~0,3 s) | http://<rpi>:8888/hud (HLS).
  # ffmpeg lit le MJPEG du HUD servi par web_video_server (service bamboo_video, port 8080
  # publie sur l'hote : localhost puisque MediaMTX est sur le reseau de l'hote) et l'ENCODE
  # en H.264 avec l'encodeur MATERIEL du RPi4 (h264_v4l2m2m,
  # /dev/video11 : pilote bcm2835_codec + gpu_mem 128, actives le 2026-10-16 ; DietPi les
  # coupe par defaut). Pourquoi : en WebRTC un Wi-Fi qui perd des paquets fait SAUTER des
  # images, la ou le MJPEG (TCP) accumulait un retard sans fin (cf. doc §6.7). ~1 Mbit/s au
  # lieu de ~5. -g 20 : une image cle toutes les 2 s, pour qu'un lecteur qui arrive (ou un
  # paquet perdu) retrouve vite l'image. A LA DEMANDE comme `cam` : rien ne tourne au repos.
  hud:
    runOnDemand: >
      ffmpeg -hide_banner -loglevel warning -fflags nobuffer -f mjpeg -r 10
      -i http://localhost:8080/stream?topic=/video/stream&type=ros_compressed
      -c:v h264_v4l2m2m -b:v 1200k -g 20 -pix_fmt yuv420p
      -f rtsp rtsp://localhost:8554/$MTX_PATH
    runOnDemandRestart: yes
    runOnDemandCloseAfter: 15s
