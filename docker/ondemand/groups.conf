# groups.conf -- groupes de services A LA DEMANDE (option B, decidee le 2026-10-11).
#
# Un conteneur (le gestionnaire de modes de bamboo_control) ne pilote PAS Docker : il depose
# `on` ou `off` dans /run/bamboo-ondemand/<groupe>.want, et bamboo-ondemand.sh, cote HOTE,
# demarre ou arrete les services du groupe. Cette liste est FERMEE : un groupe absent d'ici,
# ou un service absent de sa ligne, ne peut pas etre demarre par ce chemin.
#
# Format : <groupe> <service compose> [<service compose>...]   (# = commentaire)
#
# nav : la navigation de BambooWS (mode NAV). Le lidar d'abord : le diagnostic et le
# superviseur de navigation l'exigent des leur demarrage.
nav driver.lidarD500 navigation

# mission : services qu'un PLAN DE MISSION (/run/bamboo-ondemand/mission.plan, depose par bamboo_mission_manager) peut ETEINDRE puis
# DEMARRER. Meme liste fermee que `optionnels` de bamboo_control/config/missions.yaml : tout service absent d'ici est REFUSE par l'hote,
# quoi que dise le plan. Le socle (driver.esp32, bamboo_control, rosbridge, camera, portail...) n'y figure JAMAIS.
mission bamboo_videotracking bamboo_calibration driver.lidarD500 navigation

# ZL + ZR en appui long (manette, tous les modes) : lance / arrete le suivi video. Le HUD (bandeau, touches) en depend : overlay_node en fait partie.
tracking bamboo_videotracking
