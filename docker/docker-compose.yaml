version: "3.9"
networks:
  linorobot2.network:
    external: false
volumes:
  # cache d'esptool pour le service flash.esp32 (voir son commentaire)
  esptool_cache:
  # Galerie SFace + jeu d'apprentissage du groupe tracking. VOLUME NOMME et pas un chemin du
  # depot : data/faces/ n'est PAS versionne (visages de personnes reelles), et un bind-mount
  # sur l'arbre de travail le ferait apparaitre dans `git status` a chaque acquisition. A jeter
  # par `docker volume rm bamboov4_humble_bamboo_faces`.
  bamboo_faces:
  # Espace de travail colcon du banc (service bringup.stm32, profil `bench`). SANS ces deux
  # volumes, `build/` et `install/` vivent dans la couche inscriptible du conteneur : tout
  # conteneur neuf -- et chaque `run --rm` d'un essai -- reconstruit a FROID, mesure de 8 a
  # 12 min. Avec eux, le build survit a un `--force-recreate` et un essai ne paie que ses
  # paquets modifies. Revers assume : un fichier qui DEMENAGE laisse un lien symbolique mort
  # (--symlink-install) que recreer le conteneur ne suffit plus a purger -- il faut alors
  # `docker volume rm bamboov4_humble_bench_build bamboov4_humble_bench_install`.
  bench_build:
  bench_install:
  # Espace de travail colcon PARTAGE par les services du robot bambooSTM32YB (bamboo_video,
  # bamboo_videotracking, bamboo_control, driver.stm32). Meme motif que bench_build, plus deux
  # raisons apparues le 2026-09-29 :
  #  - la compilation etant desormais A LA DEMANDE (docker/rosbuild.sh) et non plus faite par
  #    les `command:`, elle doit survivre au conteneur : un `compose run --rm` a sa propre
  #    couche inscriptible, et un `exec` exige un conteneur en marche que la garde de la
  #    `command:` fait sortir aussitot si install/ est vide -- sans volume, aucun moyen de
  #    construire ;
  #  - PARTAGE et non un volume par service : les quatre services construisent les MEMES
  #    bamboo_interfaces et bamboo_base. Quatre copies, c est quatre fois la meme compilation
  #    et quatre occasions de divergence d ABI sur les messages.
  # Un seul build a la fois (il est manuel et serie) : pas de colcon concurrent sur ce volume.
  ws_build:
  ws_install:

services:   
  base:
    image: ${COMPOSE_PROJECT_NAME}-linorobot2-${DEPLOY}:${ROS_DISTRO}
    build:
      context: ../
      dockerfile: docker/Dockerfile
      args:
        BASE_GIT_LINOROBOT2: ${BASE_GIT_LINOROBOT2}
        ROS_DISTRO: ${ROS_DISTRO}
        ROBOT_BASE: ${ROBOT_BASE}
        LASER_SENSOR: ${LASER_SENSOR} 
        DEPTH_SENSOR: ${DEPTH_SENSOR}
      target: ${DEPLOY}
    hostname: linorobot2-${ROS_DISTRO}
    stdin_open: true
    tty: true
#    network_mode: host
    networks:
    - linorobot2.network
    ipc: host
    privileged: true
    environment:
      - BASE_GIT_LINOROBOT2=${BASE_GIT_LINOROBOT2}
      - LINOROBOT2_BASE=${ROBOT_BASE} 
      - LINOROBOT2_LASER_SENSOR=${LASER_SENSOR} 
      - LINOROBOT2_DEPTH_SENSOR=${DEPTH_SENSOR} 
      - DISPLAY=${DISPLAY} 
      - QT_X11_NO_MITSHM=1
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - $HOME/.Xauthority:/root/.Xauthority
#      - ../linorobot2_navigation/maps:/root/linorobot2_ws/src/linorobot2/linorobot2_navigation/maps:rw
      - ..:/root/linorobot2_ws/src/linorobot2:rw
      - /dev:/dev

  build:
    image: ${COMPOSE_PROJECT_NAME}.linorobot2-build:${ROS_DISTRO}
    build:
      context: ../
      dockerfile: docker/Dockerfile
      args:
        BASE_GIT_LINOROBOT2: ${BASE_GIT_LINOROBOT2}
        ROS_DISTRO: ${ROS_DISTRO}
        ROBOT_BASE: ${ROBOT_BASE}
        LASER_SENSOR: ${LASER_SENSOR} 
        DEPTH_SENSOR: ${DEPTH_SENSOR}
      target: build
    hostname: linorobot2-build-${ROS_DISTRO}
    stdin_open: true
    tty: true
#    network_mode: host
    networks:
    - linorobot2.network
    ipc: host
    privileged: true
    environment:
      - BASE_GIT_LINOROBOT2=${BASE_GIT_LINOROBOT2}
      - LINOROBOT2_BASE=${ROBOT_BASE} 
      - LINOROBOT2_LASER_SENSOR=${LASER_SENSOR} 
      - LINOROBOT2_DEPTH_SENSOR=${DEPTH_SENSOR} 
      - DISPLAY=${DISPLAY} 
      - QT_X11_NO_MITSHM=1
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - $HOME/.Xauthority:/root/.Xauthority
      - ../linorobot2_navigation/maps:/root/linorobot2_ws/src/linorobot2/linorobot2_navigation/maps:rw
      - /dev:/dev


#=== 1 - Booting up robot

#--- rosbridge
  rosbridge:
    image: linorobot2-rosbridge:${ROS_DISTRO}
    # Profil `boot` : marque les services qui demarrent au boot du RPi. C'est le DEMON DOCKER
    # qui les relance, via `restart: unless-stopped` -- pas systemd. L'unite
    # `bamboo4wd.service` ne fait que le rattrapage (creer les conteneurs absents pour qu'ils
    # collent au compose), cf. docker/systemd/bamboo4wd.service, et elle NOMME ces services.
    # ⚠️ NE PAS lancer `docker compose --profile boot up -d` : `--profile` est ADDITIF, pas
    # restrictif. Il ajoute `boot` au profil `default`, auquel appartient tout service sans
    # `profiles:` -- donc cette commande demarre AUSSI les 19 autres services, jusqu'aux
    # services de build (constat du 2026-09-22 : compilation du firmware Teensy declenchee au
    # boot). Utiliser la liste nommee de l'unite, ou `install_bambooWS.sh`.
    # Nommer un service active son profil implicitement, donc `up -d rosbridge` et
    # l'orchestrateur MCP marchent toujours.
    profiles: ["boot"]
    restart: unless-stopped
    build:
      context: ../
      dockerfile: docker/Dockerfile
      args:
        ROS_DISTRO: ${ROS_DISTRO}
        ROBOT_BASE: ${ROBOT_BASE}
        LASER_SENSOR: ${LASER_SENSOR} 
        DEPTH_SENSOR: ${DEPTH_SENSOR}
      target: rosbridge
    hostname: linorobot2-rosbridge-${ROS_DISTRO}
    stdin_open: true
    tty: true
#    network_mode: host
    networks:
    - linorobot2.network
    ipc: host
    privileged: true
    environment:
      - LINOROBOT2_BASE=${ROBOT_BASE} 
      - LINOROBOT2_LASER_SENSOR=${LASER_SENSOR} 
      - LINOROBOT2_DEPTH_SENSOR=${DEPTH_SENSOR} 
      - DISPLAY=${DISPLAY} 
      - QT_X11_NO_MITSHM=1
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - $HOME/.Xauthority:/root/.Xauthority
      - ../linorobot2_navigation/maps:/root/linorobot2_ws/src/linorobot2/linorobot2_navigation/maps:rw
      - /dev:/dev
    ports:
      - "9090:9090"
    command: ros2 launch rosbridge_server rosbridge_websocket_launch.xml

#--- foxglovebridge
  foxglovebridge:
    image: linorobot2-foxglovebridge:${ROS_DISTRO}
    profiles: ["boot"]          # cf. rosbridge
    restart: unless-stopped
    build:
      context: ../
      dockerfile: docker/Dockerfile
      args:
        ROS_DISTRO: ${ROS_DISTRO}
        ROBOT_BASE: ${ROBOT_BASE}
        LASER_SENSOR: ${LASER_SENSOR} 
        DEPTH_SENSOR: ${DEPTH_SENSOR}
      target: foxglovebridge
    hostname: linorobot2-rosbridge-${ROS_DISTRO}
    stdin_open: true
    tty: true
#    network_mode: host
    networks:
    - linorobot2.network
    ipc: host
    privileged: true
    environment:
      - LINOROBOT2_BASE=${ROBOT_BASE} 
      - LINOROBOT2_LASER_SENSOR=${LASER_SENSOR} 
      - LINOROBOT2_DEPTH_SENSOR=${DEPTH_SENSOR} 
      - DISPLAY=${DISPLAY} 
      - QT_X11_NO_MITSHM=1
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - $HOME/.Xauthority:/root/.Xauthority
      - ../linorobot2_navigation/maps:/root/linorobot2_ws/src/linorobot2/linorobot2_navigation/maps:rw
      - /dev:/dev
    ports:
      - "8765:8765"
    command: ros2 launch foxglove_bridge foxglove_bridge_launch.xml port:=8765

#--- Publish Robot description
  robotdesc:
    extends: base
    profiles: ["boot"]          # publie /robot_description + les TF : utile des Foxglove
    restart: unless-stopped
    # publish_joints:=false : c'est le driver (esp32_mavlink_driver) qui publie les
    # VRAIS /joint_states depuis les encodeurs. Laisser le joint_state_publisher amont
    # actif ferait deux publieurs sur le meme topic, dont un qui n'emet que des zeros.
    # robot:=${ROBOT} et pas un repli : sans lui, la description retombait sur la
    # geometrie de roue ECRITE EN DUR de l autre robot (rayon 0.04 / demi-voie 0.0625
    # au lieu de 0.03425 / 0.0825 pour le STM32). C etait le SEUL des lanceurs de ce
    # fichier a ne pas nommer son robot.
    command: ros2 launch linorobot2_description description.launch.py robot:=${ROBOT}
      rviz:=false publish_joints:=false

#--- Real robot
  bringup.real:
    extends: base
    command: ros2 launch linorobot2_bringup bringup.launch.py base_serial_port:=/dev/ttyACM0
    volumes:
      - /dev:/dev

#--- Simulation
  bringup.simu:
    extends: base
    command: ros2 launch linorobot2_gazebo gazebo.launch.py

#--- Teleop
  teleop:
    extends: base
    command: ros2 run teleop_twist_keyboard teleop_twist_keyboard
    volumes:
      - /dev:/dev

#--- Camera (webcam USB : v4l2_camera -> /image_raw + web_video_server HTTP :8080)
  camera.real:
    extends: base
    # Chemin absolu vers la source bind-montee : camera.launch.py est un fichier neuf, donc
    # sans symlink dans install/share (le --symlink-install ne lie que l'existant au build).
    command: ros2 launch /root/linorobot2_ws/src/linorobot2/linorobot2_bringup/launch/camera.launch.py
    ports:
      - "8080:8080"
    volumes:
      - /dev:/dev

#--- Camera MJPG->ROS a 30 fps (etape 2) : gscam2 publie le MJPG materiel en
#    /image_raw/compressed SANS decodage, web_video_server le ressert en type=ros_compressed
#    (ni decode ni re-encode -> ~30fps, CPU quasi nul, vs ~12fps du chemin v4l2 de camera.real).
#    EXCLUSIF de camera.real et camera.h264 (contrainte UVC : un seul format sur /dev/video0) ->
#    meme port 8080, l'orchestrateur en demarre un seul. Voir camera_mjpg.launch.py.
  camera.mjpg:
    extends: base
    command: ros2 launch /root/linorobot2_ws/src/linorobot2/linorobot2_bringup/launch/camera_mjpg.launch.py
    ports:
      - "8080:8080"
    volumes:
      - /dev:/dev

#--- Camera H.264 a distance (MediaMTX) : la webcam encode le H.264 en materiel, ffmpeg le
#    recopie (-c:v copy, ZERO re-encodage RPi) et MediaMTX ressert en RTSP/HLS/WebRTC @30fps.
#    Source A LA DEMANDE -> /dev/video0 libre quand personne ne regarde (contrainte UVC : un
#    seul format a la fois, cohabite ainsi avec le MJPG->ROS). Image officielle avec ffmpeg,
#    hors stack ROS (n'etend pas base). Voir docker/mediamtx.yml.
  camera.h264:
    image: bluenviron/mediamtx:latest-ffmpeg
    hostname: mediamtx
    profiles: ["boot"]          # cf. rosbridge ; source a la demande, donc gratuit au repos
    restart: unless-stopped
    networks:
    - linorobot2.network
    privileged: true
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
      - /dev:/dev
    ports:
      - "8554:8554"       # RTSP (VLC, faible latence)
      - "8888:8888"       # HLS (navigateur)
      - "8889:8889"       # WebRTC (navigateur, faible latence)
      - "8189:8189/udp"   # WebRTC ICE

#--- Driver ESP32 (pont MAVLink) : proprietaire du serie, telemetrie + cmd_vel gatee.
#    LECTURE SEULE par defaut (enable_cmd_vel:=false du YAML) ; L6 : enable_cmd_vel:=true.
  driver.real:
    extends: base
    # LECTURE SEULE (enable_cmd_vel:=false du YAML) : un robot qui demarre deja arme n'est
    # acceptable qu'avec un homme-mort valide. Le service d'actuation de ce meme robot
    # (`drive.real`, manette) est pour la meme raison sous son propre profil `drive`.
    # Profil DEDIE et NON `boot`, revu le 2026-09-29 : ce service est le driver de BambooWS
    # (defaut `robot:=bamboo4WD_V4_WSEsp32` de bamboo_base/launch/driver.launch.py), robot dont
    # le chantier est EN PAUSE et dont la carte ESP32 n est pas sur ce montage. Il tournait donc
    # au boot en parlant a un port absent : 35 pour cent d un coeur brules pour rien, mesures a
    # T17 de bambooSTM32YB -- soit 40 pour cent de la cadence de suivi et un tiers de la latence
    # du groupe videotracking, sur une machine a 4 coeurs deja saturee. Rien de fautif dans le
    # service : il est simplement au mauvais endroit depuis que ROBOT= designe l autre robot.
    # Il reste lancable en le NOMMANT (`compose up -d driver.real`, ou l outil MCP `start`, qui
    # active implicitement le profil) le jour ou BambooWS revient -- meme motif que drive.real.
    profiles: ["real"]
    # PAS de restart: unless-stopped -- et le retrait est la moitie utile du correctif. Un profil
    # ne bride que le DEMARRAGE par compose : une politique de redemarrage, elle, est appliquee
    # par dockerd au conteneur qui EXISTE, quel que soit son profil. Constate le 2026-09-29 :
    # apres une coupure d alimentation, ce service explicitement arrete etait de nouveau en
    # marche. Sans cette ligne, un arret reste un arret.
    # Monte linorobot2_hardware pour importer tools/ (codec Esp32ComSerial) + firmware/
    # (hacks sys.path du codec resolus via __file__ -> l'arbre firmware doit etre present).
    volumes:
      - /dev:/dev
      - ../../linorobot2_hardware:/root/linorobot2_ws/src/linorobot2_hardware:rw
    # bamboo_interfaces + bamboo_base sont neufs : on les build dans la session (artefacts
    # ephemeres avec run --rm), on resource l'install, puis launch.
    # robot_control (codec) = pur Python -> PYTHONPATH sur tools/ suffit (pas de pip, absent de
    # l'image). Seule dep runtime = pyserial (python3-serial) ; bakee dans le Dockerfile, avec
    # fallback apt ici pour la 1re execution avant reconstruction de l'image. $$PYTHONPATH est
    # echappe pour que ce soit bash (et non compose) qui le developpe.
    command: >
      bash -lc "cd /root/linorobot2_ws &&
      test -f install/setup.bash || echo 'ESPACE DE TRAVAIL NON CONSTRUIT -- lancer docker/rosbuild.sh dans ce conteneur (voir son en-tete)' >&2 &&
      test -f install/setup.bash &&
      source install/setup.bash &&
      (python3 -c 'import serial' 2>/dev/null || (apt-get update && apt-get install -y python3-serial)) &&
      export PYTHONPATH=/root/linorobot2_ws/src/linorobot2_hardware/tools:$$PYTHONPATH &&
      ros2 launch bamboo_base driver.launch.py"

#--- Traction a la MANETTE du robot BambooWS (lot 5.6) : driver + joy_linux + teleop_twist_joy
#    dans UN SEUL conteneur -- le reseau compose est en bridge et la memoire partagee DDS est
#    coupee, donc on ne met pas la decouverte inter-conteneur entre un homme-mort et des
#    moteurs. EXCLUSIF avec driver.real, driver.stm32 et bringup.real : un seul proprietaire du
#    port serie.
#    HORS DU PROFIL `boot`, et ce n'est pas un oubli (cf. le commentaire de driver.real et le
#    lot 6.3) : un robot qui demarre seul avec un chemin d'actuation ouvert n'est acceptable
#    qu'apres validation du deadman -- Verification 5, robot au sol, main sur la manette.
#    A CE JOUR L'ESSAI EST IMPOSSIBLE : l'attache moteur N20 de M1 est cassee sur BambooWS.
#    Le service est donc ecrit et lancable en LECTURE SEULE (enable_cmd_vel:=false, defaut),
#    ce qui suffit a verifier le mapping des index au jstest sans qu'une roue bouge.
  drive.real:
    extends: base
    # Profil DEDIE, et ce n'est pas de la decoration : sans cle `profiles:` un service tombe
    # dans le profil `default`, donc un `docker compose up -d` NU l'aurait demarre -- et il
    # aurait saisi le port serie et publie /cmd_vel sans que personne l'ait nomme (c'est le
    # piege deja constate le 2026-09-22, cf. le commentaire du profil `boot` plus haut).
    # Nommer un service active implicitement son profil : `compose up -d drive.real` marche
    # toujours, et l'outil MCP `start` aussi, qui nomme le service.
    profiles: ["drive"]
    # Pas de restart: unless-stopped -- volontaire. Un pilotage manuel n'a pas a revenir tout
    # seul apres un arret : personne ne tient la manette au moment ou il redemarrerait.
    volumes:
      - /dev:/dev
      # Memes montages que driver.real : le codec d'hote (Esp32ComSerial) vit dans le depot
      # firmware et resout ses sys.path par __file__, l'arbre doit etre present.
      - ../../linorobot2_hardware:/root/linorobot2_ws/src/linorobot2_hardware:rw
    # `robot:=` est ECRIT EN DUR, pas ${ROBOT} : ce service est la traction de BambooWS, et
    # .env porte ROBOT=bamboo4WD_V4_YBStm32 (l'autre robot, dont les moteurs recoivent 12,6 V
    # bruts). Suivre ${ROBOT} ici enverrait la manette sur le mauvais robot au premier `up`.
    # ARMEMENT : BAMBOO_ARM n'est pas dans .env, donc le defaut false s'applique. Pour armer,
    # `BAMBOO_ARM=true docker compose up drive.real` -- l'armement reste une action explicite
    # et tracee, jamais un etat par defaut du fichier.
    command: >
      bash -lc "cd /root/linorobot2_ws &&
      test -f install/setup.bash || echo 'ESPACE DE TRAVAIL NON CONSTRUIT -- lancer docker/rosbuild.sh dans ce conteneur (voir son en-tete)' >&2 &&
      test -f install/setup.bash &&
      source install/setup.bash &&
      (python3 -c 'import serial' 2>/dev/null || (apt-get update && apt-get install -y python3-serial)) &&
      export PYTHONPATH=/root/linorobot2_ws/src/linorobot2_hardware/tools:$$PYTHONPATH &&
      ros2 launch bamboo_base drive.launch.py
      robot:=bamboo4WD_V4_WSEsp32 joy_dev:=${BAMBOO_JOY:-/dev/input/js0}
      enable_cmd_vel:=${BAMBOO_ARM:-false}"

#==== 3 - Groupes du robot bambooSTM32YB (tracking camera)
#
#     LIMITE CONNUE de la bascule ROBOT= : compose ne sait pas conditionner un service a la
#     valeur d'une variable (`profiles:` est ADDITIF, pas restrictif). ROBOT est donc propage
#     en `robot:=` aux launch -- ce qui choisit le fichier canonique, la geometrie, les PID et
#     la table servo_axes -- mais c'est l'OPERATEUR qui demarre le service de controleur de SON
#     robot (`driver.stm32` ici, `driver.real` pour BambooWS). Les deux ne se disputent rien :
#     CH340 1a86:7523 d'un cote, CP2102 de l'autre.

#--- Groupe VIDEO : acquisition + mux + streaming externe. AUTONOME par construction -- il
#    sert le flux BRUT tant qu'aucun client d'overlay ne s'est enregistre (exigence explicite,
#    validee a T10 de bambooSTM32YB). Aucun `depends_on` ni vers ni depuis le tracking.
#    EXCLUSIF avec camera.mjpg, camera.real et camera.h264 : un seul format UVC a la fois sur
#    /dev/video0, et le port 8080 est le meme que celui de camera.mjpg.
  bamboo_video:
    extends: base
    profiles: ["boot"]
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /dev:/dev
    # BAMBOO_CAM n'est PAS /dev/bamboocam par defaut, et c'est une mesure : la regle udev
    # 99-bambooSTM32YB.rules n'est pas encore posee sur ce RPi (constate a T10, le symlink
    # etait absent). Poser la regle puis mettre BAMBOO_CAM=/dev/bamboocam dans .env.
      # Build PERSISTANT et PARTAGE par les services de ce robot : voir ws_build en tete
      # de fichier. Sans lui, build/ et install/ vivent dans la couche inscriptible du
      # conteneur -- toute recreation jette la compilation, et la compilation A LA DEMANDE
      # (docker/rosbuild.sh) serait impossible : un `compose run --rm` a sa propre couche,
      # et un `exec` exige un conteneur en marche que la garde ci-dessous fait sortir.
      - ws_build:/root/linorobot2_ws/build
      - ws_install:/root/linorobot2_ws/install
    command: >
      bash -lc "cd /root/linorobot2_ws &&
      test -f install/setup.bash || echo 'ESPACE DE TRAVAIL NON CONSTRUIT -- lancer docker/rosbuild.sh dans ce conteneur (voir son en-tete)' >&2 &&
      test -f install/setup.bash &&
      source install/setup.bash &&
      ros2 launch bamboo_video video.launch.py
      robot:=${ROBOT} stream_mode:=mjpg video_device:=${BAMBOO_CAM:-/dev/video0}"

#--- Groupe TRACKING : Tracking / FaceRecog / FaceTrain / ServoCam dans UN process composee
#    (component_container_mt + intra-process). Il s'ENREGISTRE sur bamboo_video
#    (/video/register_overlay) pour recuperer le flux et le rendre enrichi.
#    HORS du profil `boot` DELIBEREMENT, jusqu'a T7 de bambooSTM32YB valide : ce groupe est le
#    seul a commander les servos, et un robot qui bouge la tete tout seul au demarrage n'est
#    pas acceptable avant d'avoir mesure les butees.
#      docker compose up -d bamboo_videotracking
  bamboo_videotracking:
    extends: base
    volumes:
      - /dev:/dev
      # Les .onnx vivent dans l'AUTRE depot. Monte en LECTURE SEULE : ce groupe lit des
      # modeles, il n'ecrit jamais dans le depot firmware. MEME POINT DE MONTAGE que
      # driver.real, a ne pas diverger -- deux chemins pour un meme depot est un piege.
      - ../../linorobot2_hardware:/root/linorobot2_ws/src/linorobot2_hardware:ro
      - bamboo_faces:/root/data/faces
    # PLUS DE COMPILATION ICI (2026-09-29) : ce service LANCE, il ne construit plus. Le build
    # est passe dans docker/rosbuild.sh, a declencher explicitement par `docker exec`. Motif
    # mesure : ce paquet est le seul C++ lourd du depot (7 unites de compilation, OpenCV dans
    # chacune), le construire au demarrage coutait ~17 min pendant lesquelles les noeuds ne
    # sont PAS adressables -- et deux services relances coup sur coup lancaient DEUX colcon
    # concurrents, saturant les 4 coeurs au point que sshd ne repondait plus a la poignee de
    # main (machine injoignable, ping toujours a 25 ms).
    # Le second facteur de duree est LEVE : l'horloge de l'HOTE Windows, ~9 h dans le futur
    # (source "Local CMOS Clock"), datait les sources du futur -- chaque .cpp etait toujours
    # "plus recent que son .o" et TOUT se recompilait ("Clock skew detected"). Recalee le
    # 2026-09-29 : un build incremental est desormais reellement incremental.
      # Build PERSISTANT et PARTAGE par les services de ce robot : voir ws_build en tete
      # de fichier. Sans lui, build/ et install/ vivent dans la couche inscriptible du
      # conteneur -- toute recreation jette la compilation, et la compilation A LA DEMANDE
      # (docker/rosbuild.sh) serait impossible : un `compose run --rm` a sa propre couche,
      # et un `exec` exige un conteneur en marche que la garde ci-dessous fait sortir.
      - ws_build:/root/linorobot2_ws/build
      - ws_install:/root/linorobot2_ws/install
    command: >
      bash -lc "cd /root/linorobot2_ws &&
      test -f install/setup.bash || echo 'ESPACE DE TRAVAIL NON CONSTRUIT -- lancer docker/rosbuild.sh dans ce conteneur (voir son en-tete)' >&2 &&
      test -f install/setup.bash &&
      source install/setup.bash &&
      ros2 launch bamboo_videotracking videotracking.launch.py robot:=${ROBOT}"

#--- Groupe MANETTE (paquet bamboo_control, lot MANETTE) : joy_linux_node + bamboo_teleop.
#    PORTE TOUS LES CONTROLES DU PROTOTYPE : stick droit -> pas relatifs sur les axes servo
#    NOMMES (service /servo/nudge), boutons -> modes du groupe videotracking, stick gauche ->
#    consigne de DEPLACEMENT sur cmd_vel. Aucun besoin du port serie : sans driver, les
#    nudges sont refuses proprement et la consigne de deplacement ne trouve pas d'abonne.
#    PROFIL `hmi` EXPLICITE, ET C'EST UNE CORRECTION : sans clef `profiles:` ce service est
#    dans le groupe `default`, donc un `docker compose up -d` NU le demarrait -- stick droit
#    en prise directe sur les servos, et desormais stick gauche a un clic du cmd_vel. Il
#    faut donc le NOMMER pour le lancer, comme bamboo_videotracking.
#    La traction reste derriere DEUX verrous en serie : `motion_enabled: false` (etat local
#    du noeud, arme au clic du stick gauche) et `enable_cmd_vel: false` du driver.
#    /dev est deja monte par `base` (privileged) -> la manette /dev/input/js0 est visible.
#    BAMBOO_JOY permet de suivre l'ordre d'appairage sans editer ce fichier (a relever a T20).
#      docker compose up -d bamboo_control
#    DEMARRE AU BOOT depuis l'essai T25 de bambooSTM32YB, a la demande explicite de
#    l'utilisateur (2026-10-02) : profil `boot` + `restart: unless-stopped`, la convention du
#    fichier. Ce que cela engage, et ce que cela n'engage PAS :
#      - la NACELLE est en prise directe des le boot : un stick droit pousse la bouge, des que
#        servocam_node tourne. C'est le prix accepte.
#      - la TRACTION, non : le noeud demarre desarme (`motion_enabled: false`, armement par
#        appui LONG volontaire sur B), ET le driver ignore cmd_vel (`enable_cmd_vel: false`).
#        Le robot ne demarre donc pas "arme" au sens de bamboo4wd.service -- c'est cette
#        distinction qui rend l'ajout compatible avec la regle de l'homme-mort.
#    Aucun besoin d'attendre la manette : joy_linux_node reessaie /dev/input/js0 chaque
#    seconde, et la manette, une fois liee (Bonded), se rattache seule a l'allumage.
#    `hmi` reste : `--profile hmi up -d bamboo_videotracking bamboo_control` marche toujours.
  bamboo_control:
    extends: base
    profiles: ["hmi", "boot"]
    restart: unless-stopped
    volumes:
      # Build PERSISTANT et PARTAGE par les services de ce robot : voir ws_build en tete
      # de fichier. Sans lui, build/ et install/ vivent dans la couche inscriptible du
      # conteneur -- toute recreation jette la compilation, et la compilation A LA DEMANDE
      # (docker/rosbuild.sh) serait impossible : un `compose run --rm` a sa propre couche,
      # et un `exec` exige un conteneur en marche que la garde ci-dessous fait sortir.
      - ws_build:/root/linorobot2_ws/build
      - ws_install:/root/linorobot2_ws/install
    command: >
      bash -lc "cd /root/linorobot2_ws &&
      test -f install/setup.bash || echo 'ESPACE DE TRAVAIL NON CONSTRUIT -- lancer docker/rosbuild.sh dans ce conteneur (voir son en-tete)' >&2 &&
      test -f install/setup.bash &&
      source install/setup.bash &&
      ros2 launch bamboo_control control.launch.py
      robot:=${ROBOT} joy_dev:=${BAMBOO_JOY:-/dev/input/js0}"

#--- Controleur STM32 (Yahboom ROS Control Board V3.0, pont MAVLink sysid 1) : proprietaire
#    UNIQUE du CH340. LECTURE SEULE par defaut (enable_cmd_vel:=false) : le pack 12,6 V arrive
#    brut sur des moteurs 7,4 V. Les SERVOS, eux, passent par /servo/cmd et sont bornes cote
#    hote -- c'est ce service qui les execute pour les axes que servo_axes lui attribue.
#    ARRETER robot_controlv3 et le MCP robot-action AVANT de le demarrer : un seul
#    proprietaire du port serie.
  driver.stm32:
    extends: base
    profiles: ["boot"]
    restart: unless-stopped
    volumes:
      - /dev:/dev
      # rw et non ro, contrairement au tracking : le codec de robot_control/ resout ses hacks
      # de sys.path par __file__, l'arbre firmware doit etre present et inscriptible.
      - ../../linorobot2_hardware:/root/linorobot2_ws/src/linorobot2_hardware:rw
      # Build PERSISTANT et PARTAGE par les services de ce robot : voir ws_build en tete
      # de fichier. Sans lui, build/ et install/ vivent dans la couche inscriptible du
      # conteneur -- toute recreation jette la compilation, et la compilation A LA DEMANDE
      # (docker/rosbuild.sh) serait impossible : un `compose run --rm` a sa propre couche,
      # et un `exec` exige un conteneur en marche que la garde ci-dessous fait sortir.
      - ws_build:/root/linorobot2_ws/build
      - ws_install:/root/linorobot2_ws/install
    command: >
      bash -lc "cd /root/linorobot2_ws &&
      test -f install/setup.bash || echo 'ESPACE DE TRAVAIL NON CONSTRUIT -- lancer docker/rosbuild.sh dans ce conteneur (voir son en-tete)' >&2 &&
      test -f install/setup.bash &&
      source install/setup.bash &&
      (python3 -c 'import serial' 2>/dev/null || (apt-get update && apt-get install -y python3-serial)) &&
      export PYTHONPATH=/root/linorobot2_ws/src/linorobot2_hardware/tools:$$PYTHONPATH &&
      ros2 launch bamboo_controler_YBStm32v3 driver.launch.py robot:=${ROBOT} enable_cmd_vel:=false"

#--- Bringup COMPLET du robot en UN SEUL conteneur (paquet bamboo4WD_V4_YBStm32_base) :
#    carte + URDF + video, et le tracking a la demande. C'est l'entree de BANC et de mise au
#    point, l'equivalent conteneurise de `ros2 launch ... bringup.launch.py`.
#    ⚠️ EXCLUSIF avec bamboo_video / bamboo_videotracking / driver.stm32 : demarrer les deux
#    leverait DEUX FOIS les memes noeuds (deux proprietaires du CH340, deux gscam2 sur
#    /dev/video0). HORS du profil `boot` : l'exploitation, c'est le decoupage en groupes, qui
#    seul permet d'arreter le tracking sans couper le flux video.
#      docker compose --profile bench up -d bringup.stm32
#      docker compose --profile bench run --rm --service-ports bringup.stm32 <commande>
#    Pour un ESSAI, garder le conteneur plutot que `--rm` : `run -d --name tc_bench
#    bringup.stm32 sleep infinity` puis des `docker exec`. Un `exec` ne passe PAS par
#    l'entrypoint : il doit sourcer ROS et l'espace de travail, et exporter
#    FASTRTPS_DEFAULT_PROFILES_FILE lui-meme.
  bringup.stm32:
    extends: base
    # Profil `bench` (E6) : sans cette cle le service etait dans `default`, donc un `up -d` NU le
    # levait -- un SECOND proprietaire du CH340, un second gscam2 sur /dev/video0 et un second
    # port 8080, alors que le commentaire ci-dessus annonce le contraire. Corollaire : tout
    # stop/start/logs/exec sur ce service exige `--profile bench`, sinon compose repond
    # `no such service` en laissant l'ancien conteneur tourner.
    profiles: ["bench"]
    ports:
      - "8080:8080"
    volumes:
      - /dev:/dev
      - ../../linorobot2_hardware:/root/linorobot2_ws/src/linorobot2_hardware:rw
      - bamboo_faces:/root/data/faces
      # Build persistant : voir le commentaire de bench_build en tete de fichier.
      - bench_build:/root/linorobot2_ws/build
      - bench_install:/root/linorobot2_ws/install
    command: >
      bash -lc "cd /root/linorobot2_ws &&
      test -f install/setup.bash || echo 'ESPACE DE TRAVAIL NON CONSTRUIT -- lancer docker/rosbuild.sh dans ce conteneur (voir son en-tete)' >&2 &&
      test -f install/setup.bash &&
      source install/setup.bash &&
      (python3 -c 'import serial' 2>/dev/null || (apt-get update && apt-get install -y python3-serial)) &&
      export PYTHONPATH=/root/linorobot2_ws/src/linorobot2_hardware/tools:$$PYTHONPATH &&
      ros2 launch bamboo4WD_V4_YBStm32_base bringup.launch.py
      robot:=${ROBOT} video_device:=${BAMBOO_CAM:-/dev/video0}
      enable_tracking:=${ENABLE_TRACKING:-false} enable_control:=${ENABLE_CONTROL:-false}
      joy_dev:=${BAMBOO_JOY:-/dev/input/js0} enable_cmd_vel:=false"

#--- flash du microcode ESP32 : outil, JAMAIS demarre par `up` (profil `tools`).
#    Tourne dans l'image ROS deja presente -> aucune image supplementaire a construire, et
#    esptool s'installe dans la couche ephemere du conteneur, pas sur l'hote dietpi.
#    Le port serie est tenu par driver.real : le STOPPER avant.
#      docker compose stop driver.real
#      docker compose --profile tools run --rm flash.esp32
#      docker compose up -d driver.real
  flash.esp32:
    extends: base
    profiles: ["tools"]
    volumes:
      - /dev:/dev
      - ../../linorobot2_hardware:/root/linorobot2_ws/src/linorobot2_hardware:rw
      # esptool survit d'un flash a l'autre : `run --rm` jette la couche ephemere, donc
      # sans ce volume chaque flash reinstallerait pip puis esptool (1 a 2 min et du
      # reseau). Volume NOMME, donc rien sur le systeme de fichiers de l'hote et rien
      # dans le depot ; a jeter par `docker volume rm bamboov4_humble_esptool_cache`.
      - esptool_cache:/opt/esptool
    command: >
      bash -lc "bash /root/linorobot2_ws/src/linorobot2/docker/flash_esp32.sh"

#==== 2 - Creating MAP

#--- in Simution 
  slam.simu:
    extends: base
    command: >
      ros2 launch linorobot2_navigation slam.launch.py
      rviz:=true
      sim:=true

#--- in real robot
  slam.real:
    extends: base
    command: >
      ros2 launch linorobot2_navigation slam.launch.py
      rviz:=false

#==== 3 - Saving the MAP
  savemap:
    extends: base
    command: >
      ros2 run nav2_map_server map_saver_cli 
      -f /root/linorobot2_ws/src/linorobot2/linorobot2_navigation/maps/map
      --fmt png
      --ros-args -p save_map_timeout:=10000.

#==== 4 - Navigationg into the MAP
  navigation.real:
    extends: base
    command: >
      ros2 launch linorobot2_navigation navigation.launch.py
      map:=/root/linorobot2_ws/src/linorobot2/linorobot2_navigation/maps/playground.pgm
      rviz:=false

  navigation.simu:
    extends: base
    command: >
      ros2 launch linorobot2_navigation navigation.launch.py
      map:=/root/linorobot2_ws/src/linorobot2/linorobot2_navigation/maps/playground.yaml
      rviz:=true
      sim:=true
      use_sim_time:=true

  default.real:
    extends: base
    command: ros2 launch linorobot2_bringup default_robot.launch.py base_serial_port:=/dev/ttyACM0
    volumes:
      - /dev:/dev

  bash:
    extends: base
    command: /bin/bash
    volumes:
      - /dev:/dev

  rviz-nav:
    extends: base
    command: rviz2 -d /root/linorobot2_ws/src/linorobot2/linorobot2_navigation/rviz/linorobot2_navigation.rviz

  rviz:
    extends: base
    command: rviz2

#=== Build atmelavr
  build.bash:
    extends: build
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ../../linorobot2_hardware:/root/linorobot2_ws/src/linorobot2_hardware:rw
      - ../../linorobot2_hardware_camera:/root/linorobot2_ws/src/linorobot2_hardware_camera:rw
    command: /bin/bash

  build.atmelavr:
    extends: build
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    command: /bin/bash -c "set +e && pio run && avrdude -c gpio -p m328p -U lfuse:w:0xFF:m && avrdude -c gpio -p m328p -U hfuse:w:0xDA:m && avrdude -c gpio -p m328p -U efuse:w:0x05:m && avrdude -c gpio -p m328p -U flash:w:.pio/build/atmelavr/firmware.hex"

#cf https://rt-net.jp/humanoid/archives/4382#toc2
  build.m5stackv2:
    extends: build
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ../../linorobot2_hardware:/root/linorobot2_ws/src/linorobot2_hardware:rw
      - ../../linorobot2_hardware_camera:/root/linorobot2_ws/src/linorobot2_hardware_camera:rw
    command: >
      cd /root/linorobot2_ws/src/linorobot2_hardware_camera
      ros2 run micro_ros_setup create_firmware_ws.sh raspbian buster_v7
      cd firmware
      mv raspbian_apps raspbian_apps.sav
      git clone https://github.com/brag00n/raspbian_apps -b humble
      cd ..
      ros2 run micro_ros_setup configure_firmware.sh image_publisher
      ros2 run micro_ros_setup build_firmware.sh
      apt-get update && apt-get install -y openssh-client
      scp firmware/bin/image_publisher root@192.168.1.196:/home/m5stack/
      ros2 run micro_ros_setup configure_firmware.sh agent_lite
      ros2 run micro_ros_setup build_firmware.sh
      scp firmware/bin/micro_ros_agent_lite root@192.168.1.196:/home/m5stack/
