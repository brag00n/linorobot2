# ============================================================================
# EKF (robot_localization) -- MODELE du lot NAV, commun aux robots bamboo
# ============================================================================
# bamboo_navigation/launch/navigation.launch.py y injecte les sujets REELS (wiring
# navigation : odom_in, imu) et use_sim_time. Sortie remappee vers `odom` du wiring.
#
# CE QUI EST FUSIONNE, ET POURQUOI :
#   odometrie roues -> vx SEULE. Le lacet des roues n'est PAS fusionne : il glisse
#     (skid-steer, s ~0,55 sur BambooWS) et le driver le corrige deja avec ce MEME gyro --
#     le fusionner compterait l'IMU deux fois et le glissement une fois de trop.
#   IMU -> vyaw (gyro z, en rad/s depuis le firmware 0.4+) : la seule mesure honnete de la
#     rotation. Pas d'angle absolu (pas de magnetometre fiable) : two_d_mode.
# vy est contraint a 0 par two_d_mode + config (4 roues fixes : pas de derive laterale
# commandee).
# ============================================================================
ekf_filter_node:
  ros__parameters:
    use_sim_time: false
    frequency: 30.0
    sensor_timeout: 0.3
    two_d_mode: true
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom
    odom0: odom/unfiltered          # injecte (wiring odom_in)
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, false,
                   false, false, false]
    odom0_differential: false
    imu0: imu/data                  # injecte (wiring imu)
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_remove_gravitational_acceleration: true
